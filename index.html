<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine</title>

    <!-- OLD FONT (as requested) -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Floating hearts -->
<div id="floating-hearts"></div>

<!-- PAGE 1 -->
<div id="question-page" class="wrapper">
    <div class="heart-main">💗</div>

    <h1 class="main-title">Will you be my<br><span>Valentine?</span></h1>
    <p class="sub-text">Choose wisely… 💕</p>

    <div class="btn-group">
        <button id="yes-btn">Yes! ✨</button>
        <button id="no-btn" tabindex="-1">No 🥺</button>
    </div>

    <p class="hint-text">Hint: The “No” button is a bit shy… 😉</p>
</div>

<!-- PAGE 2 -->
<div id="success-page" class="wrapper hidden">
    <h1 class="yay-text">Yay! 🎉<br>Good Choice!</h1>

    <div class="image-card">
        <img src="https://media.giphy.com/media/v1.Y2lkPWVjZjA1ZTQ3MmJhdXQ3Ymt4dDEycWg0aWxleDY4cXRjbjZnMHJybHl0d2U5NzIzcyZlcD12MV9naWZzX3NlYXJjaCZjdD1n/8dwMScO8qOvSFn0AB6/giphy.gif" alt="Good Choice">
    </div>

    <div class="message-card">
        <p>
            I knew you'd say yes! 💕<br><br>
            You've made me the happiest person in the world.<br>
            Can't wait to celebrate this special day with you 💖
        </p>
        <div class="mini-hearts">💖 💖 💖</div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
